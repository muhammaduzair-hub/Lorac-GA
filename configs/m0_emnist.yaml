# M0 — LoRaC-GA replication on EMNIST-Balanced (K-only). See docs/M0_EMNIST_Validation.md.
# [paper] = value from Solat & Lee 2025;  [assumed] = our choice, paper is silent.

# --- data -----------------------------------------------------------------
data_root: data
num_classes: 47          # [paper] EMNIST Balanced
num_clients: 100         # [paper] K_max
alpha_dirichlet: 0.3     # [paper]
min_samples_per_client: 1

# --- model ([assumed]: paper says only "compact transformer + LoRA") -------
vit: {dim: 128, depth: 4, heads: 4, mlp_dim: 256, patch: 4}
backbone_path: results/m0_emnist/backbone.pt   # MNIST-pretrained, frozen in FL
lora_targets: [q, v]
r: 7                     # [assumed] tuned so S ~= 0.0833 MB (see closest_rank)
lora_alpha: 14           # alpha = 2r
target_S_mb: 0.0833      # [paper]

# --- backbone pretraining ([assumed]) ---------------------------------------
pretrain: {epochs: 5, lr: 1.0e-3, batch_size: 128}

# --- federated setup --------------------------------------------------------
K: 10                    # clients per round (profiling sweeps this)
R: 10                    # [paper] rounds
tail_rounds: 3           # [assumed] A(K) = mean acc over last 3 rounds (non-IID noise)
prox_mu: 0.0             # 0 = FedAvg; set to fedprox_mu for the FedProx baseline
local_epochs: 1          # [assumed]
batch_size: 32           # [assumed]
eval_batch_size: 512
lr: 1.0e-3               # [assumed]
fedprox_mu: 0.01         # [paper] FedProx baseline mu

# --- A(K) profiling grid (dense around the paper's K* range of 2-12) --------
K_values: [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 30, 50, 100]
r_values: [7]            # K-only profile: single rank (profile_AKr reused)
seeds: [42]

# --- reproducibility / io ----------------------------------------------------
seed: 42
device: auto
output_dir: results/m0_emnist
